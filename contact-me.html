<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me | Sara's Portfolio</title>
  <link rel="icon" href="img/logo.WebP">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/globalstyle.css">
  <link rel="stylesheet" href="css/contact-me.css">
  <link rel="stylesheet" href="css/components/oneko.css">
</head>
<body class="no-select">

  <!-- Navigation Bar -->
  <div id="header-placeholder"></div>	

  <!-- Main Content -->
  <main class="contact-card">

    <div class="contact-header">
      <h1>Contact Formeowlar</h1>
	  <video autoplay muted loop playsinline class="contact-media">
		<source src="img/contact-video.mp4" class="contact-media">
	  Your browser does not support the video tag.
    </video>
    </div>
    <div class="header-rule"></div>

    <div class="contact-form">
		<div style="display:none; visibility:hidden;" aria-hidden="true">
			<label for="website_url">Leave this field blank</label>
			<input type="text" id="website_url" name="website_url" tabindex="-1" autocomplete="off">
		</div>
		<label for="senderEmail">Your Name * or E-Mail</label>
		<input type="text" id="senderEmail" maxlength="100" placeholder="E-Mail is optional if you want me to reply!" required />

		<label for="docTitle">Subject</label>
		<input type="text" id="docTitle" maxlength="100" placeholder="It's okay if you can't think of a subject right now.." />
		  
		<label for="docText">Message *</label>
		<div class="textarea-wrapper">
			<textarea id="docText" maxlength="4000" oninput="updateCharCount()" placeholder="Hmmm...  " required></textarea>
			<span id="charCount" class="char-counter">0/4000</span>
		</div>

		<div style="margin-bottom: 20px;">
			<label id="captchaLabel" for="captchaAnswer">Security Check: What is ?</label>
			<input type="number" id="captchaAnswer" class="captcha-input" placeholder="Answer" required />
		</div>
		  
		<div class="send-row">
			<button type="button" id="sendBtn" class="stamp-send" onclick="sendContactMessage()">Send</button>
			
			<!-- ONEKO COLOR -->
			<div class="cat-color-picker">
			  <label for="catColorSelect">Cat Color:</label>
			  <select id="catColorSelect">
				<option value="gray" selected>Gray</option>
				<option value="default">White</option>
				<option value="yellow">Yellow</option>
				<option value="orange">Orange</option>
				<option value="brown">Brown</option>
				<option value="pink">Pink</option>
				<option value="green">Green</option>
				<option value="blue">Blue</option>
				<option value="black">Black</option>
				<option value="disabled">Hide Cat</option>
			  </select>
			</div>
		</div>
		<div id="formStatus" class="form-status"></div>
	</div>
  </main>
  
  <!-- Footer -->
  <footer id="footer-placeholder"></footer>
  
  <!-- Scripts -->
<script type="module">
    import { initNavigation } from './js/global-navigation-and-footer.js';
    import { initHamburger } from './js/global-hamburger.js';
    import { initContactForm, updateCharCount, sendContactMessage } from './js/contact-me.js';
    
    window.updateCharCount = updateCharCount;
    window.sendContactMessage = sendContactMessage;
    
    document.addEventListener('DOMContentLoaded', async () => {
      await initNavigation();
      initContactForm();
    });
	
	document.addEventListener("touchmove", function (event) {
	  if (event.touches.length > 0) {
		const touch = event.touches[0];
		
		document.dispatchEvent(
		  new MouseEvent("mousemove", {
			clientX: touch.clientX,
			clientY: touch.clientY,
		  })
		);
	  }
	}, { passive: true });
</script>
<script src="./js/components/oneko.js" defer></script>
</body>
</html>
