<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Minesweeper">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper - Arcade Games</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./game-icon-minesweeper.WebP">
  <link rel="icon" href="./game-icon-minesweeper.WebP" type="image/webp">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/arcade-game-pwa/css/pwa-global.css">
  <link rel="stylesheet" href="/arcade-game-pwa/css/pwa-home.css">
  <link rel="stylesheet" href="/arcade-game-pwa/games/pwa-0-global-game.css">
  <link rel="stylesheet" href="./minesweeper.css">
</head>

<body>
  <!-- Navigation Bar -->
  <div id="header-placeholder"></div>  

  <!-- Main Game Container -->
  <main class="games-container">
    <minesweeper-card id="minesweeper-section"></minesweeper-card>
  </main>

  <!-- Scripts -->
  <script type="module">
    import { initNavigation } from '/arcade-game-pwa/js/pwa-global-navigation-and-footer.js';
    import { initHamburger } from '/arcade-game-pwa/js/pwa-global-hamburger.js';  
    import './minesweeper-card.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await initNavigation();
	  initHamburger();
    });
    
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/arcade-game-pwa/sw.js')
          .then(reg => console.log('Arcade Service Worker Registered!', reg.scope))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }  
  </script>
</body>
</html>
