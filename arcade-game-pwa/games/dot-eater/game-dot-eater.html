<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dot Eater">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot Eater - Arcade Games</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./game-icon-dot-eater.WebP">
  <link rel="icon" href="./game-icon-dot-eater.WebP" type="image/webp">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../css/pwa-global.css">
  <link rel="stylesheet" href="../../css/pwa-home.css">
  <link rel="stylesheet" href="../pwa-0-global-game.css">
  <link rel="stylesheet" href="./dot-eater.css">
</head>

<body>
  <!-- Navigation Bar -->
  <div id="header-placeholder"></div>  

  <!-- Main Game Container -->
  <main class="games-container">
    <dot-eater-card id="dot-eater-section"></dot-eater-card>
  </main>

  <!-- Scripts -->
  <script type="module">
    import { initNavigation } from '../../js/pwa-global-navigation-and-footer.js';
    import { initHamburger } from '../../js/pwa-global-hamburger.js';  
    import './dot-eater-card.js';
    
    document.addEventListener('DOMContentLoaded', async () => {
      await initNavigation();
	  initHamburger();
    });
    
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../../sw.js')
          .then(reg => console.log('Arcade Service Worker Registered!', reg.scope))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }  
  </script>
</body>
</html>
